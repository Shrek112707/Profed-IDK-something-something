<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>test 00000</title>
    <style>
        /* BASE NEO-BRUTALIST STYLES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        body {
            /* Stark turquoise background */
            background-color: #40E0D0;
            /* Hard, unblended grid background */
            background-image: 
                linear-gradient(black 2px, transparent 2px),
                linear-gradient(90deg, black 2px, transparent 2px);
            background-size: 60px 60px;
            overflow: hidden; /* Prevent scrolling during drag */
            width: 100vw;
            height: 100vh;
            position: relative;
            color: black;
        }

        /* INFO BOARD */
        #info-board {
            position: absolute;
            top: 20px;
            left: 20px;
            width: calc(100% - 40px);
            max-width: 600px;
            background-color: white;
            border: 6px solid black;
            box-shadow: 12px 12px 0px black;
            padding: 20px;
            z-index: 100;
            transition: background-color 0.2s;
        }
        #info-board.active {
            background-color: #FFFF00;
        }
        #info-board h1 {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            border-bottom: 4px solid black;
            padding-bottom: 10px;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }
        #info-board p {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.4;
        }
        .formula {
            display: inline-block;
            background: black;
            color: white;
            padding: 4px 8px;
            margin: 8px 0;
            font-size: 20px;
            font-weight: 900;
        }

        /* SOIL */
        #soil {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 15vh;
            background-color: #FF9900; /* High contrast orange/brown */
            border-top: 8px solid black;
            z-index: 10;
        }

        /* THE PLANT */
        #plant-container {
            position: absolute;
            bottom: 15vh;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 300px;
            z-index: 20;
            pointer-events: none; /* Let drag events pass through */
        }
        /* Plant Wiggle Animation for Active State */
        @keyframes plantWiggle {
            0% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-50%) rotate(-2deg); }
            50% { transform: translateX(-50%) rotate(0deg); }
            75% { transform: translateX(-50%) rotate(2deg); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }
        .plant-active {
            animation: plantWiggle 0.5s infinite;
        }

        /* THE SUN */
        #sun {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 120px;
            height: 120px;
            background-color: #FFF200;
            border: 6px solid black;
            border-radius: 50%; /* Circle is geometrically sharp */
            box-shadow: 10px 10px 0px black;
            cursor: grab;
            z-index: 50;
            touch-action: none; /* Prevent mobile scroll on touch */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            transition: transform 0.1s;
        }
        #sun:active {
            cursor: grabbing;
            transform: translate(4px, 4px);
            box-shadow: 6px 6px 0px black;
        }
        /* Sun Glow for active state */
        @keyframes sunPulse {
            0% { box-shadow: 10px 10px 0px black, 0 0 0px #FFF200; }
            50% { box-shadow: 10px 10px 0px black, 0 0 40px #FFF200; }
            100% { box-shadow: 10px 10px 0px black, 0 0 0px #FFF200; }
        }
        .sun-active {
            animation: sunPulse 1s infinite;
        }

        /* PARTICLES */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
        }
        .particle {
            position: absolute;
            font-weight: 900;
            font-size: 16px;
            padding: 4px 8px;
            border: 4px solid black;
            box-shadow: 4px 4px 0px black;
            opacity: 1;
        }

        /* Particle Types & Colors */
        .p-h2o { background-color: #00BFFF; color: white; }
        .p-co2 { background-color: #A9A9A9; color: white; }
        .p-o2 { background-color: white; color: black; }
        .p-glucose { background-color: #FF69B4; color: white; }

        /* Particle Animations */
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { transform: translateY(-30px) scale(1.2); opacity: 1; }
            80% { transform: translateY(-150px) scale(1); opacity: 1; }
            100% { transform: translateY(-200px) scale(0.8); opacity: 0; }
        }
        @keyframes floatInLeft {
            0% { transform: translateX(0) scale(0.5); opacity: 0; }
            20% { transform: translateX(50px) scale(1.2); opacity: 1; }
            80% { transform: translateX(200px) scale(1); opacity: 1; }
            100% { transform: translateX(250px) scale(0.8); opacity: 0; }
        }
        @keyframes floatInRight {
            0% { transform: translateX(0) scale(0.5); opacity: 0; }
            20% { transform: translateX(-50px) scale(1.2); opacity: 1; }
            80% { transform: translateX(-200px) scale(1); opacity: 1; }
            100% { transform: translateX(-250px) scale(0.8); opacity: 0; }
        }
        @keyframes floatAway {
            0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
            20% { transform: translate(20px, -40px) scale(1.2); opacity: 1; }
            80% { transform: translate(60px, -120px) scale(1); opacity: 1; }
            100% { transform: translate(80px, -160px) scale(0.8); opacity: 0; }
        }
        @keyframes dropDown {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { transform: translateY(20px) scale(1.2); opacity: 1; }
            80% { transform: translateY(80px) scale(1); opacity: 1; }
            100% { transform: translateY(100px) scale(0.8); opacity: 0; }
        }

        /* RESPONSIVENESS */
        @media (max-width: 600px) {
            #info-board { top: 10px; left: 10px; width: calc(100% - 20px); padding: 15px; }
            #info-board h1 { font-size: 20px; }
            #info-board p { font-size: 14px; }
            .formula { font-size: 14px; }
            #sun { width: 80px; height: 80px; font-size: 24px; top: 160px; right: 20px;}
        }

        /* DEBUG TERMINAL */
        #debug-terminal {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 350px;
            height: 250px;
            background-color: black;
            color: #00FF00;
            border: 6px solid black;
            box-shadow: 8px 8px 0px white;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            font-family: 'Courier New', Courier, monospace;
        }
        #debug-header {
            background-color: white;
            color: black;
            padding: 8px;
            font-weight: 900;
            cursor: grab;
            border-bottom: 4px solid black;
            font-size: 14px;
            text-transform: uppercase;
        }
        #debug-header:active {
            cursor: grabbing;
        }
        #debug-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 8px;
            font-size: 11px;
            line-height: 1.3;
            pointer-events: auto;
        }
        #debug-content::-webkit-scrollbar {
            width: 10px;
        }
        #debug-content::-webkit-scrollbar-track {
            background: #333; 
        }
        #debug-content::-webkit-scrollbar-thumb {
            background: #00FF00; 
        }
    </style>
</head>
<body>

    <!-- INFO BOARD -->
    <div id="info-board">
        <h1>test 00000</h1>
        <div id="status-content">
            <p>test 0000 test env 0000!</p>
        </div>
    </div>

    <!-- DRAGGABLE SUN -->
    <div id="sun">0000</div>

    <!-- PARTICLES CONTAINER -->
    <div id="particles"></div>

    <!-- THE PLANT (Geometric Neo-Brutalist SVG) -->
    <div id="plant-container">
        <svg width="200" height="300" viewBox="0 0 200 300">
            <!-- Stem -->
            <rect x="85" y="100" width="30" height="200" fill="#00FF00" stroke="black" stroke-width="6"/>
            <!-- Left Leaf -->
            <polygon points="85,220 10,220 10,140" fill="#00FF00" stroke="black" stroke-width="6" />
            <line x1="85" y1="220" x2="10" y2="140" stroke="black" stroke-width="6" />
            <!-- Right Leaf -->
            <polygon points="115,160 190,160 190,80" fill="#00FF00" stroke="black" stroke-width="6" />
            <line x1="115" y1="160" x2="190" y2="80" stroke="black" stroke-width="6" />
            <!-- Top Bud/Leaf -->
            <polygon points="100,20 50,100 150,100" fill="#00FF00" stroke="black" stroke-width="6" />
        </svg>
    </div>

    <!-- SOIL -->
    <div id="soil"></div>

    <!-- DEBUG TERMINAL OVERLAY -->
    <div id="debug-terminal">
        <div id="debug-header">[SYS_DEBUG] term_0000</div>
        <div id="debug-content"></div>
    </div>

    <script>
        const sun = document.getElementById('sun');
        const plant = document.getElementById('plant-container');
        const infoBoard = document.getElementById('info-board');
        const statusContent = document.getElementById('status-content');
        const particlesContainer = document.getElementById('particles');
        
        // --- TERMINAL & LOGGING LOGIC --- //
        const debugTerminal = document.getElementById('debug-terminal');
        const debugHeader = document.getElementById('debug-header');
        const debugContent = document.getElementById('debug-content');

        function techLog(msg) {
            const time = new Date().toISOString().split('T')[1].slice(0, -1);
            const formatted = `[${time}] ${msg}`;
            
            // Console spam
            console.log(formatted);
            
            // Terminal overlay spam
            const line = document.createElement('div');
            line.textContent = formatted;
            debugContent.appendChild(line);
            
            // Prevent DOM bloat by keeping only latest 60 lines
            if (debugContent.childNodes.length > 60) {
                debugContent.removeChild(debugContent.firstChild);
            }
            // Auto scroll to bottom
            debugContent.scrollTop = debugContent.scrollHeight;
        }

        // Terminal Dragging State
        let isTermDragging = false;
        let termStartX, termStartY, termInitLeft, termInitTop;

        const startTermDrag = (e) => {
            isTermDragging = true;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            termStartX = clientX;
            termStartY = clientY;
            const rect = debugTerminal.getBoundingClientRect();
            termInitLeft = rect.left;
            termInitTop = rect.top;
            
            debugTerminal.style.right = 'auto';
            debugTerminal.style.bottom = 'auto';
            debugTerminal.style.left = termInitLeft + 'px';
            debugTerminal.style.top = termInitTop + 'px';
        };

        const onTermDrag = (e) => {
            if (!isTermDragging) return;
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            debugTerminal.style.left = (termInitLeft + (clientX - termStartX)) + 'px';
            debugTerminal.style.top = (termInitTop + (clientY - termStartY)) + 'px';
        };

        const endTermDrag = () => { isTermDragging = false; };

        debugHeader.addEventListener('mousedown', startTermDrag);
        window.addEventListener('mousemove', onTermDrag);
        window.addEventListener('mouseup', endTermDrag);
        debugHeader.addEventListener('touchstart', startTermDrag, { passive: true });
        window.addEventListener('touchmove', onTermDrag, { passive: true });
        window.addEventListener('touchend', endTermDrag);

        // Dragging State
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;
        let sunActive = false;

        // Interaction Threshold
        const ACTIVATION_DISTANCE = 250; 
        
        // --- DRAG & DROP LOGIC --- //

        const startDrag = (e) => {
            isDragging = true;
            techLog('[INPUT_HW] Pointer down detected. Initiating drag context for Entity_0000.');
            // Support both mouse and touch
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            startX = clientX;
            startY = clientY;
            
            const rect = sun.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;

            // Remove right/top positioning to manage entirely via left/top
            sun.style.right = 'auto';
            sun.style.top = initialTop + 'px';
            sun.style.left = initialLeft + 'px';
        };

        const onDrag = (e) => {
            if (!isDragging) return;
            e.preventDefault(); // Prevent scrolling on touch

            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            const dx = clientX - startX;
            const dy = clientY - startY;

            let newLeft = initialLeft + dx;
            let newTop = initialTop + dy;

            // Constrain to screen bounds
            newLeft = Math.max(0, Math.min(window.innerWidth - sun.offsetWidth, newLeft));
            newTop = Math.max(0, Math.min(window.innerHeight - sun.offsetHeight, newTop));

            sun.style.left = newLeft + 'px';
            sun.style.top = newTop + 'px';
            
            // Randomly sample log events to prevent completely freezing the thread during rapid drag
            if (Math.random() > 0.7) {
                techLog(`[PHYSICS] Entity_0000 spatial coords updated -> X: ${newLeft.toFixed(1)}, Y: ${newTop.toFixed(1)}`);
            }
        };

        const endDrag = () => {
            isDragging = false;
            techLog('[INPUT_HW] Pointer up detected. Drag context released.');
        };

        // Mouse Events
        sun.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('mouseup', endDrag);

        // Touch Events
        sun.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('touchmove', onDrag, { passive: false });
        window.addEventListener('touchend', endDrag);


        // --- GAME LOGIC & PROXIMITY --- //

        function getCenter(element) {
            const rect = element.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
        }

        let particleTimer = 0;

        function gameLoop() {
            // Check distance
            const sunCenter = getCenter(sun);
            const plantCenter = getCenter(plant);

            // Shift plant center up slightly to focus on the leaves
            plantCenter.y -= 50;

            const dist = Math.hypot(sunCenter.x - plantCenter.x, sunCenter.y - plantCenter.y);

            // Log telemetry periodically
            if (particleTimer % 15 === 0) {
                techLog(`[SYS_TICK] Proximity threshold evaluated: distance=${dist.toFixed(2)}`);
            }

            if (dist < ACTIVATION_DISTANCE) {
                if (!sunActive) activatePhotosynthesis();
                
                // Spawn particles over time while active
                particleTimer++;
                if (particleTimer % 30 === 0) spawnParticle('H2O');
                if (particleTimer % 40 === 0) spawnParticle('CO2');
                if (particleTimer % 35 === 0) spawnParticle('O2');
                if (particleTimer % 50 === 0) spawnParticle('GLUCOSE');
            } else {
                if (sunActive) deactivatePhotosynthesis();
            }

            requestAnimationFrame(gameLoop);
        }

        // --- STATE CHANGES --- //

        function activatePhotosynthesis() {
            sunActive = true;
            techLog('[STATE] test env activity boolean changed to TRUE. Triggering subsystem.');
            infoBoard.classList.add('active');
            sun.classList.add('sun-active');
            plant.classList.add('plant-active');
            statusContent.innerHTML = `
                <div class="formula">0000 + 0000 + 0000 = 0000 + 0000</div>
                <p>test 00000 0000!</p>
                <p>test env 0000 test 00000 0000 test 0000!</p>
            `;
        }

        function deactivatePhotosynthesis() {
            sunActive = false;
            techLog('[STATE] test env activity boolean changed to FALSE. Halting subsystem.');
            infoBoard.classList.remove('active');
            sun.classList.remove('sun-active');
            plant.classList.remove('plant-active');
            statusContent.innerHTML = `<p>test 0000 test env 0000!</p>`;
        }


        // --- PARTICLE SYSTEM --- //

        function spawnParticle(type) {
            const memAddr = '0x' + Math.floor(Math.random() * 0xFFFFFF).toString(16).toUpperCase().padStart(6, '0');
            techLog(`[MEM_ALLOC] Spawning particle [${type}] at mem_addr ${memAddr}`);
            
            const p = document.createElement('div');
            p.classList.add('particle', `p-${type.toLowerCase()}`);
            
            const placeholders = {
                'H2O': 'test 0000',
                'CO2': 'test env',
                'O2': '0000',
                'GLUCOSE': 'test 00000'
            };
            p.innerText = placeholders[type] || '0000';

            const plantRect = plant.getBoundingClientRect();
            const soilRect = document.getElementById('soil').getBoundingClientRect();
            
            let animDuration = (Math.random() * 1 + 1.5) + 's'; // 1.5s to 2.5s
            
            // Positioning & Animation based on type
            if (type === 'H2O') {
                // Starts at soil, moves up
                const startX = plantRect.left + (Math.random() * plantRect.width);
                const startY = soilRect.top - 20;
                p.style.left = startX + 'px';
                p.style.top = startY + 'px';
                p.style.animation = `floatUp ${animDuration} linear forwards`;
            
            } else if (type === 'CO2') {
                // Comes from sides towards plant
                const fromLeft = Math.random() > 0.5;
                const startY = plantRect.top + (Math.random() * 150);
                
                if (fromLeft) {
                    p.style.left = '-100px';
                    p.style.top = startY + 'px';
                    p.style.animation = `floatInLeft ${animDuration} ease-out forwards`;
                } else {
                    p.style.left = window.innerWidth + 'px';
                    p.style.top = startY + 'px';
                    p.style.animation = `floatInRight ${animDuration} ease-out forwards`;
                }
            
            } else if (type === 'O2') {
                // Comes from leaves, floats away
                const startX = plantRect.left + (Math.random() * plantRect.width);
                const startY = plantRect.top + 50;
                p.style.left = startX + 'px';
                p.style.top = startY + 'px';
                // Randomize float away direction slightly
                const dir = Math.random() > 0.5 ? 1 : -1;
                p.style.animation = `floatAway ${animDuration} ease-out forwards`;
                // overriding specific transform for direction variance
                p.style.setProperty('--dir', dir);
            } else if (type === 'GLUCOSE') {
                // Drops from stem area
                const startX = plantRect.left + (plantRect.width / 2) - 20 + (Math.random() * 40);
                const startY = plantRect.top + 150;
                p.style.left = startX + 'px';
                p.style.top = startY + 'px';
                p.style.animation = `dropDown ${animDuration} ease-in forwards`;
            }

            particlesContainer.appendChild(p);

            // Cleanup particle after animation finishes
            p.addEventListener('animationend', () => {
                p.remove();
            });
        }

        // Start Loop
        requestAnimationFrame(gameLoop);
        techLog('[SYS_BOOT] term_0000 initialized. Listening for hardware inputs.');

    </script>
</body>
</html>
