<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>test 00000</title>
    <!-- Import a fun, readable font for a game feel -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-top: #1A8FFF;
            --sky-bottom: #87CEEB;
            --hill-back: #4CAF50;
            --hill-front: #66BB6A;
            --dirt-color: #795548;
            --sun-color: #FFD700;
            --plant-stem: #2E7D32;
            --plant-leaf: #43A047;
            --ui-font: 'Fredoka One', cursive;
            --log-font: 'Consolas', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
            background-color: var(--sky-top);
        }

        /* --- VIBRANT WORLD BACKGROUND --- */
        #world {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 65%);
            overflow: hidden;
        }

        .hills {
            position: absolute;
            bottom: 15vh;
            width: 100%;
            height: 40vh;
        }
        
        /* Layered CSS Hills */
        .hill-back {
            position: absolute;
            bottom: -50px;
            left: -10vw;
            width: 60vw;
            height: 35vh;
            background: var(--hill-back);
            border-radius: 50% 50% 0 0;
        }
        .hill-back:nth-child(2) {
            left: 40vw;
            width: 70vw;
            height: 40vh;
            background: #388E3C;
        }
        .hill-front {
            position: absolute;
            bottom: -20px;
            left: -5vw;
            width: 110vw;
            height: 25vh;
            background: var(--hill-front);
            border-radius: 50% 50% 0 0;
            box-shadow: inset 0 10px 20px rgba(255,255,255,0.2);
        }

        .dirt {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 15vh;
            background: linear-gradient(to bottom, #8D6E63, var(--dirt-color));
            border-top: 4px solid #5D4037;
        }

        /* --- GAME TITLE --- */
        #game-title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--ui-font);
            font-size: 3rem;
            color: white;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3), 0 0 20px rgba(255,255,255,0.5);
            z-index: 10;
            pointer-events: none;
        }

        /* --- DRAGGABLE ENTITIES --- */
        .draggable {
            cursor: grab;
            position: absolute;
            touch-action: none; /* Prevent scroll on touch drag */
        }
        .draggable:active {
            cursor: grabbing;
        }

        /* SUN */
        .sun-entity {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #FFFDE7 10%, #FFEB3B 40%, #F57F17 100%);
            border-radius: 50%;
            box-shadow: 0 0 40px #FFEB3B, inset 0 0 20px #FFF9C4;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50; /* ALWAYS ON TOP OF CLOUDS */
            transition: transform 0.1s;
        }
        .sun-entity:hover {
            transform: scale(1.05);
        }
        .sun-label {
            font-family: var(--ui-font);
            color: #E65100;
            font-size: 1.2rem;
            text-shadow: 0 2px 4px rgba(255,255,255,0.8);
            pointer-events: none;
        }

        /* CLOUD */
        .cloud-entity {
            width: 180px;
            height: 60px;
            background: white;
            border-radius: 50px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1), inset 0 -4px 8px rgba(0,0,0,0.05);
            z-index: 30; /* BELOW SUN */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Fluffy cloud parts */
        .cloud-entity::before, .cloud-entity::after {
            content: "";
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        .cloud-entity::before {
            width: 90px; height: 90px;
            top: -40px; left: 25px;
            box-shadow: inset 0px 4px 8px rgba(255,255,255,0.8);
        }
        .cloud-entity::after {
            width: 70px; height: 70px;
            top: -25px; right: 25px;
        }
        .cloud-label {
            font-family: var(--ui-font);
            color: #90A4AE;
            font-size: 1rem;
            z-index: 2;
            pointer-events: none;
        }

        /* --- THE PLANT --- */
        #plant-container {
            position: absolute;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 250px;
            z-index: 20;
            transition: filter 0.5s ease;
        }
        .plant-shadowed {
            filter: brightness(0.6) saturate(0.8);
        }
        
        .stem {
            position: absolute;
            bottom: 0; left: 65px;
            width: 20px; height: 180px;
            background: linear-gradient(to right, var(--plant-stem), #4CAF50, var(--plant-stem));
            border-radius: 10px;
        }
        .leaf {
            position: absolute;
            width: 70px; height: 35px;
            background: linear-gradient(135deg, #66BB6A, var(--plant-leaf));
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            z-index: 21;
        }
        .leaf-left {
            bottom: 80px; left: -5px;
            border-radius: 35px 0 35px 0;
            transform: rotate(-20deg);
        }
        .leaf-right {
            bottom: 120px; left: 85px;
            border-radius: 0 35px 0 35px;
            transform: rotate(20deg);
        }
        .leaf-top {
            bottom: 170px; left: 40px;
            width: 50px; height: 50px;
            border-radius: 50% 50% 0 50%;
            transform: rotate(45deg);
        }
        .roots {
            position: absolute;
            bottom: -30px; left: 50px;
            width: 50px; height: 40px;
        }
        .root-line {
            position: absolute;
            width: 6px; height: 40px;
            background: #BCAAA4;
            border-radius: 3px;
        }
        .root-line:nth-child(1) { transform: rotate(20deg); left: 10px; }
        .root-line:nth-child(2) { transform: rotate(-15deg); left: 30px; }
        .root-line:nth-child(3) { transform: rotate(40deg); left: 0px; height: 25px; }

        /* --- CANVAS BEAM & PARTICLES --- */
        #beamCanvas {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 25; /* Above plant, below clouds */
        }

        #particle-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 40;
        }

        .particle {
            position: absolute;
            font-family: var(--ui-font);
            color: white;
            font-size: 1.2rem;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
            opacity: 0;
            animation: floatUp 3s ease-in forwards;
        }
        
        .particle-glowing {
            color: #00E676;
            text-shadow: 0 0 10px #00E676, 0 0 20px white;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 1; transform: translateY(-20px) scale(1.1); }
            80% { opacity: 0.8; transform: translateY(-100px) scale(1); }
            100% { transform: translateY(-150px) scale(0.8); opacity: 0; }
        }

        /* --- DEBUG CMD MENU (No AI Slop) --- */
        #debug-cmd {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 400px;
            height: 250px;
            background-color: rgba(15, 15, 20, 0.95);
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            font-family: var(--log-font);
            overflow: hidden;
            display: none; /* Hidden by default, toggled via key/click */
        }
        #debug-cmd.visible {
            display: flex;
        }

        #cmd-header {
            background: linear-gradient(90deg, #2c3e50, #34495e);
            color: #ecf0f1;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #cmd-header:active { cursor: grabbing; }
        #cmd-toggle { cursor: pointer; color: #e74c3c; font-size: 16px; }

        #cmd-body {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
            color: #bdc3c7;
            font-size: 12px;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
        }
        #cmd-log { flex-grow: 1; }
        
        .log-line.sys { color: #2ecc71; }
        .log-line.warn { color: #f1c40f; }
        .log-line.user { color: #3498db; }

        #cmd-input-wrapper {
            display: flex;
            margin-top: 5px;
            border-top: 1px solid #333;
            padding-top: 5px;
        }
        #cmd-prompt { color: #e67e22; margin-right: 8px; }
        #cmd-input {
            background: transparent;
            border: none;
            color: #ecf0f1;
            font-family: var(--log-font);
            font-size: 12px;
            flex-grow: 1;
            outline: none;
        }

        /* Secret Button to open debug menu if no keyboard */
        #secret-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 30px; height: 30px;
            background: transparent;
            border: none;
            color: rgba(0,0,0,0.1);
            font-size: 20px;
            cursor: pointer;
            z-index: 1000;
        }
        #secret-btn:hover { color: rgba(255,255,255,0.5); }
    </style>
</head>
<body>

    <div id="world">
        <!-- Background Scenery -->
        <div class="hills">
            <div class="hill-back"></div>
            <div class="hill-back"></div>
            <div class="hill-front"></div>
        </div>
        <div class="dirt"></div>

        <div id="game-title">test 00000</div>

        <!-- Dynamic Beam Canvas -->
        <canvas id="beamCanvas"></canvas>

        <!-- The Plant -->
        <div id="plant-container">
            <div class="stem"></div>
            <div class="leaf leaf-left"></div>
            <div class="leaf leaf-right"></div>
            <div class="leaf leaf-top"></div>
            <div class="roots">
                <div class="root-line"></div>
                <div class="root-line"></div>
                <div class="root-line"></div>
            </div>
        </div>

        <!-- Entities Container -->
        <div id="entities-layer">
            <div id="sun" class="draggable sun-entity" style="left: 15vw; top: 10vh;">
                <span class="sun-label">0000</span>
            </div>

            <div class="draggable cloud-entity" style="left: 45vw; top: 25vh;">
                <span class="cloud-label">test env</span>
            </div>
            
            <div class="draggable cloud-entity" style="left: 70vw; top: 15vh;">
                <span class="cloud-label">test env</span>
            </div>
        </div>

        <!-- Particle Layer -->
        <div id="particle-layer"></div>
    </div>

    <!-- Debug Terminal -->
    <div id="debug-cmd" class="draggable">
        <div id="cmd-header">
            <span>DEBUG MENU ONLY</span>
            <span id="cmd-toggle">✖</span>
        </div>
        <div id="cmd-body">
            <div id="cmd-log"></div>
            <div id="cmd-input-wrapper">
                <span id="cmd-prompt">SYS></span>
                <input type="text" id="cmd-input" autocomplete="off" spellcheck="false" />
            </div>
        </div>
    </div>
    
    <!-- Secret Toggle for Mobile/Mouse users -->
    <button id="secret-btn">⚙</button>

    <script>
        // --- CORE VARIABLES ---
        const canvas = document.getElementById('beamCanvas');
        const ctx = canvas.getContext('2d');
        const plant = document.getElementById('plant-container');
        const entitiesLayer = document.getElementById('entities-layer');
        const particleLayer = document.getElementById('particle-layer');
        
        let isPhotosynthesizing = false;
        let animationFrameId;

        // --- RESIZE CANVAS ---
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- DRAG AND DROP SYSTEM ---
        let draggedElement = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        function initDraggable(el) {
            // Mouse events
            el.addEventListener('mousedown', startDrag);
            // Touch events
            el.addEventListener('touchstart', startDrag, {passive: false});
        }

        function startDrag(e) {
            // Prevent dragging if clicking inside the cmd body
            if(e.target.closest('#cmd-body') && this.id === 'debug-cmd') return;
            
            e.preventDefault();
            draggedElement = this;
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const rect = draggedElement.getBoundingClientRect();
            dragOffsetX = clientX - rect.left;
            dragOffsetY = clientY - rect.top;
        }

        function onMove(e) {
            if (!draggedElement) return;
            e.preventDefault();
            
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            let newX = clientX - dragOffsetX;
            let newY = clientY - dragOffsetY;

            // Keep in bounds
            newX = Math.max(0, Math.min(window.innerWidth - draggedElement.offsetWidth, newX));
            newY = Math.max(0, Math.min(window.innerHeight - draggedElement.offsetHeight, newY));

            draggedElement.style.left = `${newX}px`;
            draggedElement.style.top = `${newY}px`;
        }

        function onEnd() {
            draggedElement = null;
        }

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        window.addEventListener('touchmove', onMove, {passive: false});
        window.addEventListener('touchend', onEnd);

        // Initialize existing draggables
        document.querySelectorAll('.draggable').forEach(initDraggable);


        // --- PHYSICS & MATH ENGINE ---
        
        // Helper: Check if two line segments intersect (p1-p2 and p3-p4)
        function linesIntersect(x1, y1, x2, y2, x3, y3, x4, y4) {
            let det, gamma, lambda;
            det = (x2 - x1) * (y4 - y3) - (x4 - x3) * (y2 - y1);
            if (det === 0) {
                return false;
            } else {
                lambda = ((y4 - y3) * (x4 - x1) + (x3 - x4) * (y4 - y1)) / det;
                gamma = ((y1 - y2) * (x4 - x1) + (x2 - x1) * (y4 - y1)) / det;
                return (0 < lambda && lambda < 1) && (0 < gamma && gamma < 1);
            }
        }

        // Helper: Check if line intersects a rectangle (bounding box)
        function lineIntersectsRect(lx1, ly1, lx2, ly2, rx, ry, rw, rh) {
            // Check top, bottom, left, right edges of rectangle
            const top = linesIntersect(lx1, ly1, lx2, ly2, rx, ry, rx+rw, ry);
            const bottom = linesIntersect(lx1, ly1, lx2, ly2, rx, ry+rh, rx+rw, ry+rh);
            const left = linesIntersect(lx1, ly1, lx2, ly2, rx, ry, rx, ry+rh);
            const right = linesIntersect(lx1, ly1, lx2, ly2, rx+rw, ry, rx+rw, ry+rh);
            return top || bottom || left || right;
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const sun = document.getElementById('sun');
            const clouds = document.querySelectorAll('.cloud-entity');
            
            if (!sun) {
                setPhotosynthesisState(false);
                animationFrameId = requestAnimationFrame(gameLoop);
                return;
            }

            // Calculate centers
            const sunRect = sun.getBoundingClientRect();
            const sunCenterX = sunRect.left + (sunRect.width / 2);
            const sunCenterY = sunRect.top + (sunRect.height / 2);

            const plantRect = plant.getBoundingClientRect();
            // Target the leaves area of the plant
            const plantTargetX = plantRect.left + (plantRect.width / 2);
            const plantTargetY = plantRect.top + 50;

            let isBlocked = false;

            // Check collision with all clouds
            clouds.forEach(cloud => {
                const cRect = cloud.getBoundingClientRect();
                // We add a slight margin tolerance for visual accuracy
                const margin = 10;
                if (lineIntersectsRect(
                    sunCenterX, sunCenterY, plantTargetX, plantTargetY,
                    cRect.left + margin, cRect.top + margin, 
                    cRect.width - (margin*2), cRect.height - (margin*2)
                )) {
                    isBlocked = true;
                }
            });

            if (!isBlocked) {
                // DRAW SUNBEAM
                ctx.beginPath();
                ctx.moveTo(sunCenterX, sunCenterY);
                ctx.lineTo(plantTargetX, plantTargetY);
                
                // Pulsing glow effect
                const pulse = Math.sin(Date.now() / 200) * 0.2 + 0.8;
                ctx.strokeStyle = `rgba(255, 235, 59, ${0.7 * pulse})`;
                ctx.lineWidth = 25;
                ctx.shadowBlur = 30 * pulse;
                ctx.shadowColor = '#FFEB3B';
                ctx.lineCap = 'round';
                ctx.stroke();

                setPhotosynthesisState(true);
            } else {
                setPhotosynthesisState(false);
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- STATE MANAGEMENT & VISUAL FEEDBACK ---
        
        function setPhotosynthesisState(active) {
            if (isPhotosynthesizing === active) return; // No change
            
            isPhotosynthesizing = active;
            
            if (active) {
                plant.classList.remove('plant-shadowed');
                logTerminal('[PHYSICS] Line of sight unblocked. Process test 00000 STARTED.', 'sys');
            } else {
                plant.classList.add('plant-shadowed');
                logTerminal('[PHYSICS] Obstruction detected. Process test 00000 HALTED.', 'warn');
            }
        }

        // Particle Spawner
        setInterval(() => {
            if (isPhotosynthesizing) {
                spawnParticle();
            }
        }, 600); // Spawn every 600ms if active

        function spawnParticle() {
            const p = document.createElement('div');
            p.className = 'particle particle-glowing';
            p.innerText = 'test 0000';
            
            const plantRect = plant.getBoundingClientRect();
            
            // Random start position near plant leaves
            const startX = plantRect.left + (Math.random() * plantRect.width);
            const startY = plantRect.top + 30;
            
            p.style.left = `${startX}px`;
            p.style.top = `${startY}px`;
            
            particleLayer.appendChild(p);
            
            // Cleanup after animation (3s)
            setTimeout(() => {
                if (p.parentElement) p.remove();
            }, 3000);
        }


        // --- DEBUG TERMINAL SYSTEM ---
        
        const debugCmd = document.getElementById('debug-cmd');
        const cmdLog = document.getElementById('cmd-log');
        const cmdInput = document.getElementById('cmd-input');
        const cmdBody = document.getElementById('cmd-body');
        const secretBtn = document.getElementById('secret-btn');
        const cmdToggle = document.getElementById('cmd-toggle');

        function logTerminal(msg, type = 'sys') {
            const line = document.createElement('div');
            line.className = `log-line ${type}`;
            const time = new Date().toLocaleTimeString('en-US', {hour12: false, fractionalSecondDigits: 2});
            line.innerText = `[${time}] ${msg}`;
            cmdLog.appendChild(line);
            
            // Auto scroll
            cmdBody.scrollTop = cmdBody.scrollHeight;
            
            // Cleanup old logs
            if (cmdLog.childElementCount > 50) {
                cmdLog.removeChild(cmdLog.firstChild);
            }
        }

        // Toggle Terminal
        function toggleTerminal() {
            debugCmd.classList.toggle('visible');
            if (debugCmd.classList.contains('visible')) {
                cmdInput.focus();
            }
        }

        // Listen for ~ key or secret button click to open terminal
        window.addEventListener('keydown', (e) => {
            if (e.key === '`' || e.key === '~') {
                e.preventDefault();
                toggleTerminal();
            }
        });
        secretBtn.addEventListener('click', toggleTerminal);
        cmdToggle.addEventListener('click', toggleTerminal);
        
        // Command Execution
        cmdInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const val = cmdInput.value.trim();
                cmdInput.value = '';
                if (val) {
                    logTerminal(`SYS> ${val}`, 'user');
                    executeCommand(val);
                }
            }
        });

        function executeCommand(cmd) {
            switch(cmd) {
                case '//clear_clouds_async1':
                    document.querySelectorAll('.cloud-entity').forEach(el => el.remove());
                    logTerminal('Clouds cleared successfully.', 'sys');
                    break;
                case '//summon_cloud_entity1':
                    const cloud = document.createElement('div');
                    cloud.className = 'draggable cloud-entity';
                    cloud.innerHTML = '<span class="cloud-label">test env</span>';
                    cloud.style.left = `${Math.random() * 60 + 10}vw`;
                    cloud.style.top = `${Math.random() * 30 + 5}vh`;
                    entitiesLayer.appendChild(cloud);
                    initDraggable(cloud);
                    logTerminal('New cloud entity spawned.', 'sys');
                    break;
                case '//summon_sun_entity_1':
                    // Remove existing sun
                    const existingSun = document.getElementById('sun');
                    if (existingSun) existingSun.remove();
                    
                    const sun = document.createElement('div');
                    sun.id = 'sun';
                    sun.className = 'draggable sun-entity';
                    sun.innerHTML = '<span class="sun-label">0000</span>';
                    sun.style.left = '15vw';
                    sun.style.top = '10vh';
                    entitiesLayer.appendChild(sun);
                    initDraggable(sun);
                    logTerminal('Sun entity summoned/reset.', 'sys');
                    break;
                case '//reset':
                    // Clear all
                    document.querySelectorAll('.cloud-entity').forEach(el => el.remove());
                    const eSun = document.getElementById('sun');
                    if (eSun) eSun.remove();
                    
                    // Re-add Defaults
                    executeCommand('//summon_sun_entity_1');
                    executeCommand('//summon_cloud_entity1');
                    executeCommand('//summon_cloud_entity1');
                    logTerminal('Environment reset to factory defaults.', 'sys');
                    break;
                default:
                    logTerminal(`ERR: Unknown command. Allowed: //clear_clouds_async1, //summon_cloud_entity1, //summon_sun_entity_1, //reset`, 'warn');
                    break;
            }
        }

        // Initial Boot sequence log
        logTerminal('SYS BOOT v2.5... OK', 'sys');
        logTerminal('Loading Physics Engine... OK', 'sys');
        logTerminal('Listening for interactions.', 'sys');

        // Start Loop
        requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
